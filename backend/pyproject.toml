[project]
name = "freelanceflow-api"
version = "0.1.0"
description = "FreelanceFlow API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.9",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "python-multipart==0.0.34",
  "httpx==0.28.1",
  "stellar-sdk[aiohttp]==13.2.1",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-cov==7.1.0", "pytest-asyncio==1.5.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
