databases:
  - name: freelanceflow-db
    databaseName: freelanceflow
    user: freelanceflow
    plan: starter

services:
  - type: web
    name: freelanceflow-api
    env: docker
    repo: https://github.com/sudo-robi/freelanceflow.git
    branch: final-gap-closure
    rootDir: backend
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: freelanceflow-db
          property: connectionString
      - key: PORT
        value: 8000

  - type: web
    name: freelanceflow-web
    env: docker
    repo: https://github.com/sudo-robi/freelanceflow.git
    branch: final-gap-closure
    rootDir: frontend
    dockerfilePath: Dockerfile
    envVars:
      - key: API_BACKEND_URL
        value: https://freelanceflow-api.onrender.com
      - key: PORT
        value: 3000
